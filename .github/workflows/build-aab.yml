name: Build Signed Release AAB (Free + Premium)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  NDK_VERSION: "28.2.13676358"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Runner ubuntu-latest sudah punya Android SDK bawaan; cukup pastikan
      # sdkmanager ada di PATH.
      - name: Add Android SDK cmdline-tools to PATH
        run: echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      # NDK 28+ wajib untuk 16 KB page size (syarat Google Play).
      # Versi ini HARUS sama dengan ndkVersion di app/build.gradle.kts.
      - name: Install NDK & CMake
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}" "cmake;3.22.1"

      # AGP 9.1.0 minimal butuh Gradle 9.2.1.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > release.jks

      # Satu kali panggil Gradle untuk KEDUA flavor -> hasilnya 2 AAB:
      #   app/build/outputs/bundle/freeRelease/app-free-release.aab
      #   app/build/outputs/bundle/premiumRelease/app-premium-release.aab
      # Password lewat env (bukan di-inline) supaya aman dari karakter spesial.
      - name: Build signed release AAB (free + premium)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle bundleFreeRelease bundlePremiumRelease --stacktrace \
            -Pandroid.injected.signing.store.file="$(pwd)/release.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      # Cek 16 KB: semua .so arm64-v8a & x86_64 di dalam AAB harus LOAD align >= 2**14.
      # Build GAGAL di sini kalau ada yang belum lolos, jadi ketahuan sebelum upload ke Play.
      - name: Verify 16 KB page size alignment
        run: |
          set -e
          READELF="$(ls -d $ANDROID_HOME/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/*/bin)/llvm-readelf"
          fail=0
          for AAB in app/build/outputs/bundle/freeRelease/app-free-release.aab \
                     app/build/outputs/bundle/premiumRelease/app-premium-release.aab; do
            echo "=== $AAB ==="
            rm -rf /tmp/aabx && mkdir /tmp/aabx
            unzip -q "$AAB" 'base/lib/*' -d /tmp/aabx
            for so in /tmp/aabx/base/lib/arm64-v8a/*.so /tmp/aabx/base/lib/x86_64/*.so; do
              minalign=$("$READELF" -lW "$so" | awk '$1=="LOAD"{print $NF}' | sort -n | head -1)
              if [ $((minalign)) -ge 16384 ]; then
                echo "OK        $so (align $minalign)"
              else
                echo "UNALIGNED $so (align $minalign)"; fail=1
              fi
            done
          done
          exit $fail

      # 2 artifact terpisah supaya bisa download salah satu saja.
      - name: Upload FREE AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: aab-dtx-free-release
          path: app/build/outputs/bundle/freeRelease/app-free-release.aab

      - name: Upload PREMIUM AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: aab-dtx-premium-release
          path: app/build/outputs/bundle/premiumRelease/app-premium-release.aab

      # Mapping R8 (obfuscation). Simpan: dipakai untuk membaca stack trace crash dari build ini.
      # (Mapping juga sudah otomatis ada di dalam AAB untuk Play Console.)
      - name: Upload R8 mapping files
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: |
            app/build/outputs/mapping/freeRelease/mapping.txt
            app/build/outputs/mapping/premiumRelease/mapping.txt

      # Hapus keystore dari runner setelah build selesai.
      - name: Cleanup keystore
        if: always()
        run: rm -f release.jks
