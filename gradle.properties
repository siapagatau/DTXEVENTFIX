org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AGP 9 default-nya pakai built-in Kotlin compiler + DSL baru. Project ini
# masih pakai plugin org.jetbrains.kotlin.android eksternal + DSL classic,
# jadi 2 baris ini di-off-kan biar TIDAK perlu migrasi besar-besaran.
# (opt-out ini masih didukung sepanjang seri AGP 9.x)
android.builtInKotlin=false
android.newDsl=false
